<!doctype html>
<html lang="vi" data-theme="green" data-side="groom">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Thiệp Cưới | Đình Huy & Diệu Linh</title>
    <meta
      name="description"
      content="Thiệp cưới điện tử của Đình Huy & Diệu Linh - 29.11.2026"
    />
    <meta property="og:title" content="Thiệp Cưới | Đình Huy & Diệu Linh" />
    <meta
      property="og:description"
      content="Trân trọng kính mời quý khách đến chung vui cùng gia đình chúng tôi!"
    />
    <meta property="og:image" content="../assets/root_images/HNH03675.jpg" />
    <meta property="og:type" content="website" />
    <script>
      window.__WEDDING_SIDE = "groom";
      (async function () {
        try {
          const res = await fetch("../index.html");
          let html = await res.text();
          html = html.replace(
            "<head>",
            '<head><base href="../"><script>window.__WEDDING_SIDE="groom";<\/script>',
          );
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          console.error("Không thể tải trang thiệp cưới:", e);
        }
      })();
    </script>
  </head>

</html>
